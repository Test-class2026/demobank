{% extends "base.html" %}
{% block title %}Customers · {{ bank_name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Customers</h1>

<form class="row g-2 mb-3" hx-get="{{ url_for('bank.customers') }}" hx-target="#results"
      hx-trigger="input changed delay:300ms from:#q, change from:#kyc, submit" hx-push-url="true">
  <div class="col-md-8">
    <input id="q" class="form-control" type="search" name="q" value="{{ q }}"
           placeholder="Search by name or email" aria-label="Search customers" autocomplete="off">
  </div>
  <div class="col-md-4">
    <select id="kyc" class="form-select" name="kyc" aria-label="KYC status">
      <option value="">Any KYC status</option>
      {% for s in ["VERIFIED", "PENDING", "REJECTED"] %}
      <option value="{{ s }}" {{ "selected" if kyc == s }}>{{ s.title() }}</option>
      {% endfor %}
    </select>
  </div>
</form>

<div id="results">{% include "_customer_rows.html" %}</div>
{% endblock %}
